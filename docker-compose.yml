version: '3.8'

services:
  krishimitra-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishimitra-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://your-supabase.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
      - NEXT_PUBLIC_FASTAPI_URL=http://krishimitra-ml:8000
    depends_on:
      - krishimitra-ml
    restart: unless-stopped

  krishimitra-ml:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishimitra-ml-service
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - PORT=8000
    restart: unless-stopped
